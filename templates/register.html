{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-logo">⚡</div>
      <h1>Create Account</h1>
      <p>Join ResumeAI — it's free</p>
    </div>
    <form method="POST" action="{{ url_for('register') }}" class="auth-form">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="name" placeholder="Abhay Kumar" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" placeholder="Min 8 characters" required minlength="6">
      </div>
      <div class="form-group">
        <label>Account Type</label>
        <select name="role">
          <option value="user">Candidate / Job Seeker</option>
          <option value="admin">Recruiter / Admin</option>
        </select>
      </div>
      <button type="submit" class="btn-primary btn-full">Create Account →</button>
    </form>
    <div class="auth-footer">
      <p>Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
  </div>
</div>
{% endblock %}
